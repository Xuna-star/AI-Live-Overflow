<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body { margin:0; background:transparent; display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; }
#pet { width:120px; height:120px; cursor:pointer; transition:all 0.3s; }
.eyes { fill:#333; }
.body { fill:#ff9999; transition:fill 0.5s; }
.blush { fill:#ff6b9d; opacity:0.5; }
@keyframes bounce {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-10px); }
}
@keyframes shake {
  0%,100% { transform:rotate(0); }
  25% { transform:rotate(-10deg); }
  75% { transform:rotate(10deg); }
}
.happy { animation:bounce 0.6s ease; }
.angry { animation:shake 0.4s ease; }
</style>
</head>
<body>
<svg id="pet" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- body -->
  <ellipse class="body" cx="60" cy="70" rx="40" ry="35" />
  <!-- ears -->
  <ellipse cx="30" cy="35" rx="15" ry="20" class="body" />
  <ellipse cx="90" cy="35" rx="15" ry="20" class="body" />
  <!-- face -->
  <ellipse cx="60" cy="60" rx="28" ry="22" fill="#ffe0e0" />
  <!-- eyes -->
  <circle cx="48" cy="58" r="5" class="eyes" />
  <circle cx="72" cy="58" r="5" class="eyes" />
  <!-- blush -->
  <ellipse cx="40" cy="68" rx="6" ry="3" class="blush" />
  <ellipse cx="80" cy="68" rx="6" ry="3" class="blush" />
  <!-- mouth -->
  <path d="M52 72 Q60 80 68 72" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
<script>
const pet = document.getElementById('pet');
const svg = pet.contentDocument || pet;
function randomReaction() {
  const reactions = ['happy','angry','blink'];
  const r = reactions[Math.floor(Math.random()*3)];
  pet.className = r;
  setTimeout(() => pet.className = '', 1000);
}
setInterval(randomReaction, 8000);
pet.addEventListener('click', () => {
  pet.className = 'happy';
  setTimeout(() => pet.className = '', 800);
});
</script>
</body>
</html>
