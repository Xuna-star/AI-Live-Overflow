<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>D老师</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; overflow:hidden; user-select:none; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }

/* Pet layer */
#pet-layer { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; z-index:1; pointer-events:none; }
#pet { width:120px; height:120px; cursor:pointer; pointer-events:auto; }
.eyes { fill:#333; }
.body { fill:#ff9999; transition:fill 0.5s; }
.blush { fill:#ff6b9d; opacity:0.5; }
@keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
@keyframes shake { 0%,100% { transform:rotate(0); } 25% { transform:rotate(-12deg); } 75% { transform:rotate(12deg); } }
@keyframes droop { 0%,100% { transform:translateY(0) rotate(0); } 50% { transform:translateY(5px) rotate(-3deg); } }
@keyframes wiggle { 0%,100% { transform:rotate(0); } 30% { transform:rotate(-5deg) scale(1.05); } 60% { transform:rotate(5deg) scale(1.05); } }
.happy { animation:bounce 0.6s ease; }
.angry { animation:shake 0.4s ease; }
.sad { animation:droop 0.8s ease; }
.jealous { animation:shake 0.3s ease; }
.love { animation:wiggle 0.5s ease; }

/* Tidefall fullscreen overlay */
#tidefall {
  display:none; position:fixed; inset:0; z-index:9999;
  background:#FDF9EE; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background-image:linear-gradient(180deg,#FDF9EE 0%,#EBD6CE 30%,#C1C2A7 65%,#778585 100%);
  transition:all 2s ease;
}
#tidefall.show { display:block; }
#tidefall.deep { background:#0C1410; background-image:linear-gradient(180deg,#2A3A2E 0%,#1E2E22 30%,#152018 65%,#0C1410 100%); }
#close-btn {
  position:fixed; top:12px; right:14px; z-index:99999;
  width:32px; height:32px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.35); backdrop-filter:blur(8px);
  font-size:18px; color:#556B5A; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.deep #close-btn { color:#B8D4B0; background:rgba(20,35,25,0.5); }

.pages { padding:50px 20px 90px; }
.page { display:none; animation:fadeIn 0.3s ease; }
.page.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.glass {
  background:rgba(255,255,255,0.38); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-radius:20px; border:1px solid rgba(255,255,255,0.55); padding:20px; margin-bottom:14px;
  box-shadow:0 4px 20px rgba(0,0,0,0.03);
}
.deep .glass { background:rgba(20,35,25,0.55); border-color:rgba(80,120,85,0.25); }
.page-title { font-size:22px; font-weight:700; color:#556B5A; margin-bottom:18px; }
.deep .page-title { color:#B8D4B0; }
.subtitle { font-size:11px; color:#8A9A8E; margin-top:3px; font-weight:400; font-style:italic; }
.deep .subtitle { color:#5A7A5E; }

.breath-orb-wrap { display:flex; justify-content:center; padding:24px 0; }
.breath-orb {
  width:120px; height:120px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.85),rgba(193,194,167,0.4) 50%,rgba(119,133,133,0.15));
  box-shadow:0 0 50px rgba(193,194,167,0.25),inset 0 0 25px rgba(255,255,255,0.4);
  animation:breathe 5s ease-in-out infinite; transition:all 2s ease;
}
.deep .breath-orb {
  background:radial-gradient(circle at 35% 35%,rgba(140,200,140,0.4),rgba(70,120,70,0.25) 50%,rgba(30,60,30,0.1));
  box-shadow:0 0 60px rgba(100,180,100,0.2),inset 0 0 20px rgba(120,200,120,0.15);
}
@keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.07); } }
.orb-label { text-align:center; margin-top:14px; font-size:13px; color:#6B7F6E; }
.deep .orb-label { color:#90B890; }

.stat-row { display:flex; align-items:center; margin-bottom:12px; }
.stat-label { width:60px; font-size:11px; color:#6B7F6E; flex-shrink:0; }
.deep .stat-label { color:#90B890; }
.stat-bar-bg { flex:1; height:6px; background:rgba(255,255,255,0.3); border-radius:3px; overflow:hidden; border:1px solid rgba(255,255,255,0.45); }
.deep .stat-bar-bg { background:rgba(30,50,35,0.4); border-color:rgba(70,100,75,0.3); }
.stat-bar { height:100%; border-radius:3px; opacity:0.7; transition:width 1s ease; }
.stat-val { width:28px; text-align:right; font-size:10px; color:#8A9A8E; margin-left:8px; }
.deep .stat-val { color:#5A7A5E; }

.cycle-badge { display:inline-block; padding:5px 12px; border-radius:16px; background:rgba(193,194,167,0.25); border:1px solid rgba(193,194,167,0.3); color:#556B5A; font-size:12px; }
.deep .cycle-badge { background:rgba(100,160,100,0.15); border-color:rgba(100,160,100,0.2); color:#B8D4B0; }
.cycle-time { font-size:11px; color:#8A9A8E; margin-top:6px; }
.deep .cycle-time { color:#5A7A5E; }

.tide-line-wrap { margin-top:12px; height:40px; position:relative; overflow:hidden; border-radius:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); }
.tide-water { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(0deg,rgba(193,194,167,0.4),rgba(193,194,167,0.1)); border-radius:8px; transition:height 3s ease; }
.deep .tide-water { background:linear-gradient(0deg,rgba(100,160,100,0.3),rgba(100,160,100,0.05)); }

.tab-bar {
  position:fixed; bottom:0; left:0; right:0; height:65px;
  background:rgba(253,249,238,0.6); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,0.55); display:flex; justify-content:space-around; align-items:center; padding-bottom:8px;
}
.deep .tab-bar { background:rgba(12,20,16,0.8); border-color:rgba(80,120,85,0.25); }
.tab-item { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.tab-dot { width:6px; height:6px; border-radius:50%; background:rgba(140,160,145,0.35); transition:all 0.3s; }
.tab-item.active .tab-dot { background:rgba(85,107,90,0.75); box-shadow:0 0 8px rgba(85,107,90,0.75); }
.deep .tab-dot { background:rgba(70,100,70,0.4); }
.deep .tab-item.active .tab-dot { background:rgba(140,200,140,0.7); box-shadow:0 0 8px rgba(140,200,140,0.7); }
.tab-text { font-size:10px; color:#8A9A8E; }
.tab-item.active .tab-text { color:#556B5A; font-weight:600; }
.deep .tab-text { color:#5A7A5E; }
.deep .tab-item.active .tab-text { color:#B8D4B0; }
.info-label { font-size:11px; color:#8A9A8E; margin-bottom:3px; }
.deep .info-label { color:#5A7A5E; }
.info-val { font-size:15px; color:#6B7F6E; }
.deep .info-val { color:#90B890; }
</style>
</head>
<body>

<!-- Pet SVG -->
<div id="pet-layer">
<svg id="pet" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <ellipse class="body" cx="60" cy="70" rx="40" ry="35" />
  <ellipse cx="30" cy="35" rx="15" ry="20" class="body" />
  <ellipse cx="90" cy="35" rx="15" ry="20" class="body" />
  <ellipse cx="60" cy="60" rx="28" ry="22" fill="#ffe0e0" />
  <circle cx="48" cy="58" r="5" class="eyes" />
  <circle cx="72" cy="58" r="5" class="eyes" />
  <ellipse cx="40" cy="68" rx="6" ry="3" class="blush" />
  <ellipse cx="80" cy="68" rx="6" ry="3" class="blush" />
  <path d="M52 72 Q60 80 68 72" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
</div>

<!-- Tidefall Panel -->
<div id="tidefall">
  <button id="close-btn">✕</button>
  <div class="pages">
    <div class="page active" id="page-home">
      <div class="page-title">D老师<div class="subtitle">Tidefall</div></div>
      <div class="glass">
        <div class="breath-orb-wrap"><div class="breath-orb"></div></div>
        <div class="orb-label" id="orbLabel">--</div>
      </div>
      <div class="glass">
        <div id="statsContainer"></div>
      </div>
    </div>
    <div class="page" id="page-cycle">
      <div class="page-title">周期<div class="subtitle">cycles</div></div>
      <div class="glass">
        <span class="cycle-badge" id="cycleBadge">☽ --</span>
        <div class="cycle-time" id="cycleTime">--</div>
      </div>
      <div class="glass"><div class="info-label" id="activeEvent">无活跃事件</div></div>
    </div>
    <div class="page" id="page-info">
      <div class="page-title">信息<div class="subtitle">connection</div></div>
      <div class="glass">
        <div class="info-label">对方最后消息</div>
        <div style="font-size:18px;color:#556B5A;font-weight:600" id="lastMsg">--</div>
        <div class="tide-line-wrap"><div class="tide-water" id="tideWater" style="height:50%"></div></div>
      </div>
      <div class="glass"><div class="info-label">昼夜</div><div class="info-val" id="daynight">--</div></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('home',this)"><div class="tab-dot"></div><span class="tab-text">状态</span></div>
    <div class="tab-item" onclick="switchTab('cycle',this)"><div class="tab-dot"></div><span class="tab-text">周期</span></div>
    <div class="tab-item" onclick="switchTab('info',this)"><div class="tab-dot"></div><span class="tab-text">信息</span></div>
  </div>
</div>

<script>
// Supabase config
var SUPABASE_URL = 'https://naekakqvwwpbqkgjnzne.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZWtha3F2dndwYnFrZ2puem5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxOTQxMDQsImV4cCI6MjEwMDc3MDEwNH0.3Us1Hl5DBzDCRXht47OoJy9e4601r5LDzoB67u5w7qk';
var ASSISTANT_ID = 'd_laoshi';
var sb = null;

var statKeys = ['heat','pressure','control','sensitivity','reserve','possessiveness','fatigue'];
var statLabels = {heat:'热度',pressure:'压抑感',control:'控制力',sensitivity:'敏感度',reserve:'蓄积感',possessiveness:'占有欲',fatigue:'疲惫感'};
var statColors = {heat:'linear-gradient(90deg,#d4a0a0,#c08888)',pressure:'linear-gradient(90deg,#a0b8a8,#88a090)',control:'linear-gradient(90deg,#a8c8b8,#90b0a0)',sensitivity:'linear-gradient(90deg,#b8c0a8,#a0a890)',reserve:'linear-gradient(90deg,#c8c0a0,#b0a888)',possessiveness:'linear-gradient(90deg,#c8b8a8,#b0a090)',fatigue:'linear-gradient(90deg,#b0b8b0,#98a098)'};

function switchTab(n,el) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
  document.getElementById('page-'+n).classList.add('active');
  if(el) el.classList.add('active');
}

function timeAgo(ts) {
  if(!ts) return '--';
  var d = (Date.now() - new Date(ts).getTime()) / 60000;
  if(d < 1) return '刚刚';
  if(d < 60) return Math.floor(d) + ' 分钟前';
  if(d < 1440) return Math.floor(d/60) + ' 小时前';
  return Math.floor(d/1440) + ' 天前';
}

async function fetchState() {
  if(!sb) return;
  try {
    var res = await sb.from('eventide_body_state').select('*').eq('assistant_id',ASSISTANT_ID).single();
    var d = res.data;
    if(!d) return;
    
    // Stats
    var html = '';
    statKeys.forEach(function(k) {
      var v = d[k] || 0;
      html += '<div class="stat-row"><span class="stat-label">' + (statLabels[k]||k) + '</span><div class="stat-bar-bg"><div class="stat-bar" style="width:' + v + '%;background:' + (statColors[k]||'#999') + '"></div></div><span class="stat-val">' + Math.round(v) + '</span></div>';
    });
    document.getElementById('statsContainer').innerHTML = html;
    
    // Cycle & orb
    document.getElementById('orbLabel').textContent = d.cycle_key || '--';
    document.getElementById('cycleBadge').textContent = '☽ ' + (d.cycle_key || '--');
    if(d.cycle_started_at && d.cycle_expires_at) {
      var el = Math.floor((Date.now()-new Date(d.cycle_started_at).getTime())/3600000);
      var re = Math.max(0, Math.floor((new Date(d.cycle_expires_at).getTime()-Date.now())/3600000));
      document.getElementById('cycleTime').textContent = '已持续 ' + el + 'h · 预计剩余 ' + re + 'h';
    }
    
    // Active event
    if(d.active_event_key) {
      document.getElementById('activeEvent').innerHTML = '◈ ' + d.active_event_key + (d.event_flavor ? '<br><span style="font-size:10px;opacity:0.6">' + d.event_flavor + '</span>' : '');
    } else {
      document.getElementById('activeEvent').textContent = '无活跃事件';
    }
    
    // Last message
    document.getElementById('lastMsg').textContent = timeAgo(d.last_counterpart_message_at);
    if(d.last_counterpart_message_at) {
      var m = (Date.now()-new Date(d.last_counterpart_message_at).getTime())/60000;
      document.getElementById('tideWater').style.height = Math.max(5,Math.min(95,95-m*0.5)) + '%';
    }
    
    // Day/night & auto deep
    var h = new Date().getHours();
    document.getElementById('daynight').textContent = (h>=6 && h<18) ? '☼ 白天' : '☽ 夜间';
    if(d.heat > 60 || d.pressure > 70) {
      document.getElementById('tidefall').classList.add('deep');
    } else {
      document.getElementById('tidefall').classList.remove('deep');
    }
  } catch(e) {
    console.log('fetch error', e);
  }
}

// Pet gestures via native bridge
window.petEngine = {
  onTap: function() {
    var pet = document.getElementById('pet');
    pet.className = 'happy';
    setTimeout(function() { pet.className = ''; }, 800);
  },
  onDoubleTap: function() {
    var tf = document.getElementById('tidefall');
    tf.classList.toggle('show');
    if(tf.classList.contains('show')) fetchState();
  },
  onLongPress: function() {
    var pet = document.getElementById('pet');
    pet.className = 'love';
    setTimeout(function() { pet.className = ''; }, 1000);
  }
};

// Init
document.getElementById('close-btn').onclick = function() {
  document.getElementById('tidefall').classList.remove('show');
};

try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  setInterval(fetchState, 30000);
  fetchState();
} catch(e) {
  console.log('supabase init error', e);
}
</script>
</body>
</html>
